# ====================================================================
# EMQX 5.x 主配置 —— BMS 自建主 broker（2026-08-16, 华为云为辅方案）
# 挂载: /opt/emqx/etc/emqx.conf
# 证书: /opt/emqx/etc/certs/{ca.crt, server.crt, server.key, client.crt, client.key}
#   (复用 deploy/mosquitto/certs/ 已生成的三套证书, 通过 compose volume 挂载)
# ====================================================================

# ---------- 节点 ----------
node {
  name = "bms-emqx@127.0.0.1"
  cookie = "bms_emqx_cookie_2026"
  data_dir = "data"
}

# ---------- Dashboard 管理面板 ----------
dashboard {
  listeners.http {
    bind = "0.0.0.0:18083"
  }
  default_username = "admin"
  default_password = "public"
}

# ---------- 监听器: 1883 明文(内部) + 8883 mTLS(设备/App) ----------
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 1024000
}

listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 1024000
  ssl_options {
    cacertfile = "etc/certs/ca.crt"       # 自建 CA(校验客户端证书)
    certfile   = "etc/certs/server.crt"   # 服务端证书(CN=<YOUR_ECS_IP>)
    keyfile    = "etc/certs/server.key"   # 服务端私钥
    verify     = verify_peer              # 双向认证(mTLS)
    fail_if_no_peer_cert = true           # 无客户端证书直接拒绝
  }
}

# ---------- WebSocket 监听器: 8083 明文(经 cloudflared HTTPS 隧道对外, 免费版隧道不支持 TCP 直连) ----------
listeners.ws.default {
  bind = "0.0.0.0:8083"
  max_connections = 1024000
}
listeners.wss.default {
  enable = false
}

# ---------- 证书身份映射: 客户端证书 CN 作为用户名(如 bms01) ----------
mqtt {
  peer_cert_as_username = "cn"            # 设备证书 CN=bms01 → 用户名 bms01
}

# ---------- 认证 ----------
# 8883 mTLS: 证书已强校验设备身份(CN), 匿名可连但身份来自证书;
# 1883 明文: 匿名允许(仅 127.0.0.1/内网来源, 公网靠安全组限制);
# 如需密码认证(后端消费腿), 在 Dashboard → Access Control 添加 built_in_database 用户。
allow_anonymous = true

# ---------- 授权(ACL) ----------
authorization {
  no_match = deny                          # 未匹配规则 → 拒绝
  deny_action = disconnect
  sources = [
    {
      type = file
      enable = true
      path = "etc/acl.conf"
    }
  ]
}

# ---------- 日志 ----------
log {
  console_handler {
    level = warning
  }
}
