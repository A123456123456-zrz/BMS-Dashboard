%% ====================================================================
%% EMQX File ACL - BMS self-hosted main broker (2026-08-16)
%% Mounted: /opt/emqx/etc/acl.conf, referenced by emqx.conf
%% Rule syntax (Erlang tuples):
%%   {allow, {user, "username"}, publish,   ["topic"]}.
%%   {allow, {user, "username"}, subscribe, ["topic"]}.
%% Unmatched rules -> no_match = deny (set in emqx.conf)
%% NOTE: this file is parsed by erl_scan - keep it ASCII-only.
%% ====================================================================

%% bms01: device second channel (cert CN=bms01, mTLS) - publish telemetry/events/status + subscribe commands
{allow, {user, "bms01"}, publish,   ["bms/bms01/#"]}.
{allow, {user, "bms01"}, subscribe, ["bms/bms01/#"]}.

%% dashboard/backend consumer leg (1884 plaintext) - subscribe/publish all bms/#
{allow, {user, "dashboard"}, subscribe, ["bms/#"]}.
{allow, {user, "dashboard"}, publish,   ["bms/#"]}.

%% student: mobile App / test client - subscribe + publish bms/# (WSS 通道设备/App 发布)
{allow, {user, "student"}, subscribe, ["bms/#"]}.
{allow, {user, "student"}, publish,   ["bms/#"]}.

%% everything else denied (no_match = deny)
