# mosquitto.conf —— BMS 专用 MQTT broker (双通道架构 2026-08-16)
# 对应 deploy/docker-compose.yml 中的 mosquitto 服务
# 端口:
#   1883 (MQTT, 仅 127.0.0.1 内部: bridge 桥接 + 后端 mqtt_client 消费, 明文不暴露公网)
#   8883 (MQTT over TLS, mTLS 双向证书: 设备第二通道 + 手机 App 直连)
#   9001 (WebSocket 可选, 当前未开启)

# ===== 内部明文 listener(bridge 桥接 + 后端消费) =====
# 注: 保持 0.0.0.0 —— bms-bridge 容器为 host 网络, 经宿主机回环连 127.0.0.1:1883,
#     若此处绑 127.0.0.1(容器内回环)会切断 bridge。公网暴露靠安全组限制。
listener 1883 0.0.0.0
protocol mqtt

# ===== mTLS 双向证书 listener(公网设备/App 入口, 2026-08-16) =====
listener 8883 0.0.0.0
protocol mqtt
cafile   /mosquitto/config/certs/ca.crt        # 自建 CA(签名 server+client)
certfile /mosquitto/config/certs/server.crt    # 服务端证书(CN=<YOUR_ECS_IP>)
keyfile  /mosquitto/config/certs/server.key    # 服务端私钥
require_certificate true                       # 强制客户端证书(mTLS 双向校验)
use_identity_as_username true                  # 用客户端证书 CN 作为用户名(如 bms01)

# 允许匿名连接(关闭, 强制用户名密码或证书身份)
allow_anonymous false

# 密码文件(Docker volume 挂载, 供 1883 内部账号使用)
password_file /mosquitto/config/passwd

# 2026-08-16 双通道架构: ACL 权限控制(禁止越权发布/伪造数据)
acl_file /mosquitto/config/acl

# ===== 日志 =====
log_type all
log_dest stdout
log_timestamp true

# ===== 连接限制 =====
max_connections -1          # 不限连接数(仅内网/桥接用, 安全可控)
max_keepalive 300           # MQTT keepalive 300s

# ===== 持久化(可选: 断线重连后 session 保留) =====
persistence true
persistence_location /mosquitto/data/
autosave_interval 1800      # 每30分钟自动保存

# ===== 安全(轻量服务器够用) =====
# 不开 WebSocket(前端走 SocketIO→Flask, 不直连 MQTT)
# 如需手机 App 直连可取消下面注释:
# listener 9001 0.0.0.0
# protocol websockets
