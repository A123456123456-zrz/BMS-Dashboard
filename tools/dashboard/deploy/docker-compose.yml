# BMS Dashboard —— 阿里云 ECS 全套部署(仪表盘 + 桥接 + 自建MQTT broker)
# 前置: tools/dashboard/ 下已有 backend/(含 dashboard.env / .secret_key) 与 frontend/
# 用法(在 tools/dashboard/ 目录执行):
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# 架构:
#   ESP32 → 华为云IoTDA → [bms-bridge拉取] → [mosquitto broker:bms主题] → 手机/App消费
#                                   ↓
#                           [bms-dashboard:5000] → 浏览器(公网80)
#
# 三件套全部 restart: unless-stopped, 服务器重启自动恢复

services:
  # ===== 1) BMS 仪表盘(Flask + SocketIO) =====
  bms-dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: bms-dashboard:latest
    container_name: bms-dashboard
    restart: unless-stopped
    ports:
      - "80:5000"             # 公网 HTTP:80 → 容器内 Flask:5000 (浏览器直接访问 http://<公网IP>/ )
    environment:
      - TZ=Asia/Shanghai
      # 2026-08-16 修复: bms-dashboard 无 host 网络, 容器内 127.0.0.1 指向自身,
      #   消费腿必须用 compose 服务名连 broker(不能默认 127.0.0.1)
      - BMS_BRIDGE_MQTT_HOST=mosquitto
      - BMS_BRIDGE_MQTT_PORT=1883
      - BMS_BRIDGE_MQTT_USER=student
      - BMS_BRIDGE_MQTT_PASS=${BMS_MQTT_PASS:-<BROKER_PASSWORD>}
    volumes:
      - ../backend/dashboard.env:/app/backend/dashboard.env:ro
      - ../backend/.secret_key:/app/backend/.secret_key:ro
      - ../backend/bms_history.db:/app/backend/bms_history.db
      # 2026-08-16: 固件目录挂载宿主目录, 网页 /api/ota/publish 上传即落盘、容器重建不丢
      - ../firmware:/app/firmware
    depends_on:
      - mosquitto             # broker 先启动(桥接要连它)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket,sys; sys.exit(0 if socket.create_connection(('127.0.0.1',5000),2) else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ===== 2) IoTDA → MQTT 桥接进程 =====
  bms-bridge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: bms-dashboard:latest
    container_name: bms-bridge
    restart: unless-stopped
    network_mode: host         # 直连宿主机 127.0.0.1:1883
    environment:
      - TZ=Asia/Shanghai
      - BMS_BRIDGE_MQTT_HOST=127.0.0.1
      - BMS_BRIDGE_MQTT_PORT=1883
      - BMS_BRIDGE_MQTT_USER=student
      - BMS_BRIDGE_MQTT_PASS=${BMS_MQTT_PASS:-<BROKER_PASSWORD>}
      - BMS_BRIDGE_TOPIC=bms
      - BMS_BRIDGE_INTERVAL=10
    volumes:
      - ../backend/dashboard.env:/app/backend/dashboard.env:ro
      - ../backend/.secret_key:/app/backend/.secret_key:ro
    command: ["python", "iotda_mqtt_bridge.py"]
    depends_on:
      - mosquitto
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys; live=any('iotda_mqtt_bridge' in open('/proc/%s/cmdline'%p,'rb').read().decode('utf-8','ignore') for p in os.listdir('/proc') if p.isdigit()); sys.exit(0 if live else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ===== 3) 自建 MQTT broker (Mosquitto) =====
  # 供桥接写入 + 手机App/其他系统订阅; 用户名 student / 密码见 .env 或默认值
  # 首次启动需创建密码文件(见下方部署步骤第6步)
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: bms-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"           # 内部明文(仅安全组限制来源; bridge/后端消费)
      - "8883:8883"           # mTLS 双向证书(2026-08-16: 设备第二通道/App 直连)
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro   # 含 mosquitto.conf + passwd + acl + certs/
      - ./mosquitto/data:/mosquitto/data          # 持久化 session/store
      - ./mosquitto/log:/mosquitto/log            # 日志(可选)
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  default:
    name: bms-net
